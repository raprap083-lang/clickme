<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form with EmailJS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }
    input, textarea {
      width: 90%;
      padding: 8px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #formSection {
      display: none;
      margin-top: 10px;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Contact Form</h2>
    <button id="showFormBtn">Click Me</button>

    <div id="formSection">
      <input type="text" id="name" placeholder="Your Name" required><br>
      <input type="email" id="email" placeholder="Your Email" required><br>
      <textarea id="message" placeholder="Mensahe..." rows="4"></textarea><br>
      <button id="sendBtn">Confirm</button>
      <p id="status"></p>
    </div>
  </div>

  <!-- ✅ Latest EmailJS library -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    window.onload = function() {
      console.log("✅ Page loaded successfully.");

      // 🔹 Palitan mo ito ng sarili mong EmailJS info
      const EMAILJS_SERVICE_ID = "service_1ths9az";
      const EMAILJS_TEMPLATE_ID = "template_qay58le";
      const EMAILJS_PUBLIC_KEY = "lHI6QvHXgg7N-K8O4";

      // Initialize EmailJS safely
      try {
        emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
        console.log("✅ EmailJS initialized.");
      } catch (err) {
        console.error("❌ EmailJS init error:", err);
      }

      const showFormBtn = document.getElementById("showFormBtn");
      const formSection = document.getElementById("formSection");
      const sendBtn = document.getElementById("sendBtn");
      const status = document.getElementById("status");

      // Show the form when clicked
      showFormBtn.addEventListener("click", function() {
        console.log("🟢 Button clicked!");
        formSection.style.display = "block";
        showFormBtn.style.display = "none";
      });

      // Send email when clicking "Ipadala"
      sendBtn.addEventListener("click", function() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const message = document.getElementById("message").value;

        if (!name || !email) {
          alert("Pakilagay ang pangalan at email.");
          return;
        }

        status.textContent = "⏳ Pinapadala...";
        console.log("📤 Sending email...");

        emailjs
          .send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
            from_name: name,
            reply_to: email,
            message: message
          })
          .then(() => {
            console.log("✅ Email sent!");
            status.textContent = "✅ Naipadala na ang email!";
          })
          .catch((error) => {
            console.error("❌ Email send error:", error);
            status.textContent = "❌ Error: " + error.text;
          });
      });
    };
  </script>
</body>
</html>
